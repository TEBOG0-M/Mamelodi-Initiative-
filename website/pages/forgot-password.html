<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Mamelodi Initiative supports learners through education, mentorship and opportunities."
    />
    <title>Forgot Password | Mamelodi Initiative</title>
    <link rel="stylesheet" href="../assets/style.css" />
  </head>
  <body data-root="../" data-page="forgot-password">
    <div id="site-header"></div>
    <main class="auth-wrap">
      <section class="auth-card">
        <span class="eyebrow">Account recovery</span>
        <h1>Forgot your password?</h1>
        <p class="muted">
          Enter your email address to request a password reset link.
        </p>
        <form data-auth-form>
          <div class="field">
            <label for="email">Email address</label
            ><input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              required
            />
          </div>
          <div class="form-message" role="status"></div>
          <button class="btn btn-primary" type="submit" style="width: 100%">
            Send reset link
          </button>
        </form>
        <p class="text-center" style="margin-top: 1.2rem">
          <a href="login.html">← Back to sign in</a>
        </p>
      </section>
    </main>
    <div id="site-footer"></div>
    <script src="../assets/js/components.js" defer></script>
  </body>
</html>
