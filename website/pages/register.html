<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Mamelodi Initiative supports learners through education, mentorship and opportunities."
    />
    <title>Register | Mamelodi Initiative</title>
    <link rel="stylesheet" href="../assets/style.css" />
  </head>
  <body data-root="../" data-page="register">
    <div id="site-header"></div>
    <main class="auth-wrap">
      <section class="auth-card">
        <span class="eyebrow">Join the community</span>
        <h1>Create an account</h1>
        <p class="muted">Register to access your account.</p>
        <form data-auth-form>
          <div class="field">
            <label for="name">Full name</label
            ><input id="name" name="name" autocomplete="name" required />
          </div>
          <div class="field">
            <label for="email">Email address</label
            ><input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              required
            />
          </div>
          <div class="field">
            <label for="password">Create password</label
            ><input
              id="password"
              name="password"
              type="password"
              autocomplete="new-password"
              minlength="8"
              required
            /><small class="form-note">Use at least 8 characters, with a letter and a number.</small>
          </div>
          <div class="field">
            <label for="confirm-password">Confirm password</label
            ><input
              id="confirm-password"
              name="confirmPassword"
              type="password"
              minlength="8"
              required
            />
          </div>
          <div class="form-message" role="status"></div>
          <button class="btn btn-primary" type="submit" style="width: 100%">
            Create account
          </button>
                    <p class="form-note text-center" style="margin: 1rem 0 0.6rem">or</p>
          <button class="btn btn-secondary" type="button" data-google style="width: 100%">
            Sign up with Google
          </button>
        </form>
        <p class="text-center" style="margin-top: 1.2rem">
          Already registered? <a href="login.html">Sign in</a>
        </p>
      </section>
    </main>
    <div id="site-footer"></div>
    <script src="../assets/js/components.js" defer></script>
  </body>
</html>
